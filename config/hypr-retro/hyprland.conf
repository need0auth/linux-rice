# Legacy starter for Hyprland 0.48–0.54. For 0.55+ use hyprland.lua.
# Use an absolute config root below if you installed with --config-root.
$spideyRetroConfigRoot = ~/.config
monitor = , preferred, auto, auto

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

source = $spideyRetroConfigRoot/hypr-spidey-retro/rice.conf
