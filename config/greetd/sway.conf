# A restricted compositor for the login prompt, not your desktop session.
# No terminal, launcher, workspace, reload or exit bindings are exposed here.
xwayland disable
output * bg #081b35 solid_color
default_border none
default_floating_border none
seat * hide_cursor 8000

# Set your login keyboard layout here if it differs from the system default:
# input type:keyboard xkb_layout br

exec /usr/local/share/spidey-greeter/start-greeter
