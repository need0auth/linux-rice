# Spidey Tracker terminal. Use with kitty --config ~/.config/kitty-spidey/kitty.conf
font_family monospace
font_size 11.0
disable_ligatures always
cursor_shape block
cursor_blink_interval 0
enable_audio_bell no
window_padding_width 12
background_opacity 0.97
hide_window_decorations yes
confirm_os_window_close 1

foreground #ece7df
background #090c10
selection_foreground #090c10
selection_background #ff454b
cursor #ff454b
cursor_text_color #090c10
url_color #61d4ee
active_border_color #ff454b
inactive_border_color #303239
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #090c10
active_tab_background #ff454b
inactive_tab_foreground #9aa7bd
inactive_tab_background #172236

color0 #172236
color1 #ff454b
color2 #7ce3b0
color3 #ffd479
color4 #5d9dff
color5 #b88cff
color6 #61d4ee
color7 #c5cedc
color8 #516078
color9 #ff6b81
color10 #a5edcb
color11 #ffe3a6
color12 #8dbbff
color13 #d1b2ff
color14 #9be7f6
color15 #f4f5f8
