$font = Monospace

general {
    hide_cursor = false
}

background {
    monitor =
    color = rgba(090c10ff)
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    inner_color = rgba(101317ff)
    outer_color = rgba(ff454bff)
    check_color = rgba(7ce3b0ff)
    fail_color = rgba(ff454bff)
    font_color = rgba(ece7dfff)
    fade_on_empty = false
    rounding = 0
    font_family = $font
    placeholder_text = AUTHENTICATE
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = SPIDEY TRACKER // SESSION LOCKED
    color = rgba(ff454bff)
    font_size = 16
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ece7dfff)
    font_size = 60
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}
