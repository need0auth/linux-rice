# Spidey Tracker / local session lock.
# The lock action exports these paths, including custom XDG_CONFIG_HOME installs:
#   SPIDEY_LOCK_ASSETS  -> installed hypr-spidey/lock-assets directory
#   SPIDEY_WALLPAPER    -> assets/wallpapers/spidey-city.png in the checkout
# PAM authentication stays with Hyprlock and the distribution's PAM policy.

general {
    hide_cursor = true
}

# Hard pixel edges suit the tracker; authentication never waits for an animation.
animations {
    enabled = false
}

background {
    monitor =
    path = $SPIDEY_WALLPAPER
    color = rgba(192450ff)
    blur_passes = 0
    noise = 0
}

# A translucent navy veil keeps the password panel legible over any wallpaper.
shape {
    monitor =
    size = 100%, 100%
    color = rgba(122743a8)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Pixel frame, mask badge, bevels and status chips are lossless PNG artwork.
# The panel is 544 x 588 logical pixels, so it fits a 1366 x 768 output.
image {
    monitor =
    path = $SPIDEY_LOCK_ASSETS/access-panel.png
    size = 544
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = SPIDEY TRACKER
    color = rgba(122743ff)
    font_size = 17
    font_family = Silkscreen
    position = 18, 252
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = LOCAL SESSION / HYPRLAND
    color = rgba(8ceaffff)
    font_size = 10
    font_family = Silkscreen
    position = 0, 194
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = $TIME
    color = rgba(fff0ccff)
    font_size = 54
    font_family = Silkscreen
    position = 0, 140
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +'%a / %d %b %Y'
    color = rgba(8ceaffff)
    font_size = 11
    font_family = Silkscreen
    position = 0, 82
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = AGENT / $USER
    color = rgba(78ecb6ff)
    font_size = 12
    font_family = Silkscreen
    position = 0, 38
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = IDENTITY VERIFICATION
    color = rgba(fff0ccff)
    font_size = 11
    font_family = Silkscreen
    position = 0, -16
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 416, 60
    outline_thickness = 4
    inner_color = rgba(122743ff)
    outer_color = rgba(49c7f4ff)
    check_color = rgba(78ecb6ff)
    fail_color = rgba(ff958dff)
    capslock_color = rgba(ffd39aff)
    bothlock_color = rgba(ffd39aff)
    font_color = rgba(fff0ccff)
    font_family = DejaVu Sans Mono
    fade_on_empty = false
    rounding = 0
    placeholder_text = ENTER YOUR PASSWORD
    check_text = VERIFYING IDENTITY...
    fail_text = ACCESS DENIED / $ATTEMPTS
    dots_size = 0.25
    dots_spacing = 0.3
    dots_rounding = 0
    position = 0, -68
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = ENTER / UNLOCK
    color = rgba(fff0ccff)
    font_size = 11
    font_family = Silkscreen
    position = 0, -132
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = SESSION LOCKED
    color = rgba(122743ff)
    font_size = 10
    font_family = Silkscreen
    position = -124, -188
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = LOCAL AUTH
    color = rgba(122743ff)
    font_size = 10
    font_family = Silkscreen
    position = 124, -188
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = ESC / CLEAR INPUT
    color = rgba(8ceaffff)
    font_size = 9
    font_family = Silkscreen
    position = 0, -232
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = PEACH BORDER / CAPS LOCK
    color = rgba(ffd39aff)
    font_size = 8
    font_family = Silkscreen
    position = 0, -254
    halign = center
    valign = center
    zindex = 2
}
