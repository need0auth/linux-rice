# Legacy starter for Hyprland 0.48–0.54. For 0.55+ use hyprland.lua.
# Use an absolute config root below if you installed with --config-root.
$spideyConfigRoot = ~/.config
monitor = , preferred, auto, auto

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

source = $spideyConfigRoot/hypr-spidey/rice.conf
